<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa da Família</title>
<meta name="theme-color" content="#0d6656">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — rail lateral fixo + área de trabalho; no celular a rail vira barra inferior com "Mais" */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --sunken:#eaeeeb; --ink:#16201c; --muted:#5b6862; --line:#dce2de; --grid:#e6ebe8;
  --accent:#0d6656; --accent-soft:#dcefe9; --accent-ink:#ffffff; --c2:#c58b3a;
  --good:#2c7a45; --good-soft:#e1f1e5; --warn:#a86a12; --warn-soft:#f8ecd6; --crit:#b23c34; --crit-soft:#f7e0dd; --info:#2d5c9a; --info-soft:#e0e9f6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1312; --surface:#161d1b; --sunken:#111816; --ink:#e4ebe7; --muted:#93a29b; --line:#27322e; --grid:#1e2825;
  --accent:#4fb8a2; --accent-soft:#16332c; --accent-ink:#06120f; --c2:#d9a35a;
  --good:#6cc386; --good-soft:#15291c; --warn:#e0a548; --warn-soft:#2e2312; --crit:#ec7b70; --crit-soft:#331a17; --info:#7ea6e0; --info-soft:#17233a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1312; --surface:#161d1b; --sunken:#111816; --ink:#e4ebe7; --muted:#93a29b; --line:#27322e; --grid:#1e2825;
  --accent:#4fb8a2; --accent-soft:#16332c; --accent-ink:#06120f; --c2:#d9a35a;
  --good:#6cc386; --good-soft:#15291c; --warn:#e0a548; --warn-soft:#2e2312; --crit:#ec7b70; --crit-soft:#331a17; --info:#7ea6e0; --info-soft:#17233a;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--good)} .neg{color:var(--crit)} .muted{color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
h1,h2,h3,h4{text-wrap:balance}
code{font:12.5px var(--f-num);background:var(--sunken);padding:1px 6px;border-radius:4px}

/* moldura */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.brand{font:700 17px/1.1 var(--f-display);display:flex;align-items:center;gap:10px;padding:0 8px}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:500 12px var(--f-num);font-style:normal;flex:none}
.brand.big{font-size:20px;padding:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .more-btn{display:none}
.who{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:2px}
.who b{color:var(--ink);font-weight:600}
main{min-width:0;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.topbar .tt{flex:1 1 220px;min-width:0}
.topbar h1{font:700 26px/1.15 var(--f-display);margin:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-width:0;flex:0 1 280px;color:var(--muted)}
.search svg{width:16px;height:16px;flex:none}
.search input{border:0;background:none;outline:0;width:100%;padding:8px 0}
.user{position:relative}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sunken);font-weight:600}
.menu{position:absolute;right:0;top:44px;z-index:12;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:200px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu .sub{padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button{border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px}
.menu button:hover{background:var(--sunken)}

/* botões */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.block{width:100%;padding:10px}
.btn:disabled,.mini:disabled{opacity:.45;cursor:not-allowed}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:12.5px;white-space:nowrap}
.mini:hover{border-color:var(--muted)}
.mini.primary{border-color:var(--accent);color:var(--accent);font-weight:600}
.mini.ghost{border-color:transparent;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
td.r .actions{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* painéis */
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel.flush{padding:0;overflow:hidden}
.panel h2{font:600 15px/1.3 var(--f-body);margin:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-head.pad{padding:16px 18px 0}
.flush .panel-head{margin-bottom:12px}
.hint{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0;max-width:80ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}
.bar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* indicadores */
.kpis{display:grid;grid-template-columns:1.35fr repeat(3,minmax(0,1fr));grid-template-rows:auto auto;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{border:0;background:var(--surface);text-align:left;padding:16px 18px;display:flex;flex-direction:column;gap:5px;min-width:0}
button.kpi:hover{background:var(--sunken)}
.kpi .v{font:500 21px/1.15 var(--f-num);font-variant-numeric:tabular-nums;border:0;background:none;padding:0;text-align:left}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{grid-row:span 2;background:var(--accent-soft);gap:10px;justify-content:center}
.kpi.hero .v{font-size:34px;color:var(--accent)}
.hero-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.hero-top select{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12px}
.hz-form{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.hz-form input{padding:4px 6px;font-size:12.5px;background:var(--surface);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.how{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:0;text-align:left}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip button{border:0;background:var(--surface);text-align:left;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip button:hover{background:var(--sunken)}
.strip span{font-size:12px;color:var(--muted)}
.strip b{font-weight:500;font-size:14.5px}
.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.totals>div{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.totals>div>span:first-child{font-size:12px;color:var(--muted)}
.totals b{font-weight:500;font-size:17px}
.totals.in{margin:12px 0;grid-template-columns:repeat(3,minmax(0,1fr))}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts.f3{grid-template-columns:1.4fr 1fr 1fr}
.facts>div{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.facts b{font-weight:500}
.facts b.big{font-size:26px;color:var(--accent)}

/* cartões no painel */
.cards{display:flex;flex-direction:column}
.cardrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.4fr) auto;gap:16px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.cardrow:first-child{border-top:0;padding-top:0}
.cardrow:hover .cr-n b{color:var(--accent)}
.cr-n{display:flex;flex-direction:column;gap:3px;min-width:0}
.meta{font-size:12px;color:var(--muted);display:block}
.barcell{display:flex;flex-direction:column;gap:5px;min-width:0}
.bar{height:8px;border-radius:4px;background:var(--sunken);display:flex;overflow:hidden;max-width:100%}
.bar span{display:block;height:100%}
.bar .a{background:var(--accent)}
.bar .b{background:var(--accent);opacity:.32}
.bar.prog{display:inline-flex;width:120px;vertical-align:middle}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend.inl{margin:0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.b{opacity:.32} .legend i.c2{background:var(--c2)}
.amt{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.amt b{font-weight:500;font-size:15px}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li.wide{grid-template-columns:auto minmax(0,1fr) auto}
.li .d{font-size:12px;color:var(--muted)}
.li .t{min-width:0;display:flex;flex-direction:column}
.cat{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 104px;gap:10px;align-items:center;padding:5px 0;font-size:13px;border:0;background:none;width:100%;text-align:left;border-radius:6px}
.cat[data-act]:hover .cat-n{color:var(--accent)}
.cat .bar{height:10px}
.cat .num{text-align:right}
.cat-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pílulas */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-info{color:var(--info);background:var(--info-soft)} .p-warn{color:var(--warn);background:var(--warn-soft)} .p-crit{color:var(--crit);background:var(--crit-soft)} .p-good{color:var(--good);background:var(--good-soft)} .p-mute{color:var(--muted);background:var(--sunken)}

/* tabelas */
.tbl-wrap{overflow-x:auto}
.panel:not(.flush) .tbl-wrap{margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.flush th:first-child,.flush td:first-child{padding-left:18px}
.flush th:last-child,.flush td:last-child{padding-right:18px}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tr[data-open],tr[data-act]{cursor:pointer}
tr[data-open]:hover td,tr[data-act]:hover td{background:var(--sunken)}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
tfoot .payrow td{font-weight:400}
tr.dim td{opacity:.55}
.tag-parc{font:500 11.5px var(--f-num);color:var(--muted);background:var(--sunken);padding:1px 6px;border-radius:4px;margin-left:6px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:15px}
.empty .btn{margin-top:6px}

/* filtros e navegação interna */
.filters{display:flex;gap:8px;flex-wrap:wrap}
select,input,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;max-width:100%}
.filters select{min-width:0;flex:0 1 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.subnav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.subnav button{border:0;background:none;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.subnav button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.monthnav{display:flex;gap:6px;align-items:center}
.inline-field{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.inline-field input{width:120px;font-family:var(--f-num);text-align:right}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:170px}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab b{font-weight:600}
.tab span{font-size:12px;color:var(--muted)}
.tab.add{justify-content:center;color:var(--muted);border-style:dashed;min-width:0}
.fat-nav{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.fat-chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.s-paga{background:var(--good)}.s-aberta{background:var(--info)}.s-fechada{background:var(--warn)}.s-parcial{background:var(--crit)}
.fat-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.fat-head h2{font:700 20px/1.2 var(--f-display);margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fat-sum{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.fat-sum div{display:flex;flex-direction:column}
.fat-sum span{font-size:11.5px;color:var(--muted)}
.fat-sum b{font-weight:500;font-size:16px}

/* gráficos */
.chart svg{width:100%;height:auto;display:block}
svg text{font:11px var(--f-num);fill:var(--muted)}
svg text.lbl{fill:var(--ink);font-weight:500}
svg .clk{cursor:pointer}
svg .clk:hover rect{opacity:1}

/* dívidas */
.sims{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sim{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sim.best{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sim-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sim-n{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sim-n div{display:flex;flex-direction:column}
.sim-n span{font-size:12px;color:var(--muted)}
.sim-n b{font-size:18px;font-weight:600}
.order{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.order li{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.check{display:block;padding:12px 14px;border-radius:8px;font-size:13px}
.check.ok{background:var(--good-soft)} .check.bad{background:var(--crit-soft)} .check.info{background:var(--info-soft)}
.check .actions{margin-top:10px}

/* importação */
.drop{border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:var(--r);padding:22px;display:flex;gap:16px;align-items:center;background:var(--surface);cursor:pointer}
.drop:hover{background:var(--accent-soft)}
.drop-i{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.drop-i svg{width:22px;height:22px}
.drop-t{display:flex;flex-direction:column;gap:2px}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.file{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;background:var(--sunken)}
.file .ext{font:600 10px var(--f-num);background:var(--ink);color:var(--surface);padding:1px 4px;border-radius:3px}
table.imp select{padding:4px 6px;font-size:12.5px;max-width:170px}
tr.flag td{background:color-mix(in srgb,var(--warn-soft) 60%,transparent)}
tr.dup td{background:color-mix(in srgb,var(--crit-soft) 60%,transparent)}
tr.skip td{opacity:.5}
tr.skip td b{text-decoration:line-through}
.low{border-bottom:2px dotted var(--warn)}
.footer-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel.done{border-color:var(--good);background:var(--good-soft)}
.panel.done h2{font:700 18px var(--f-display)}

/* configurações */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:14px}
.catcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap}
.inline-form.pad{padding:14px 18px;border-top:1px solid var(--line)}
.inline-form input{flex:1 1 160px;min-width:0}

/* janelas */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.drawer-top{display:flex;justify-content:space-between;align-items:center}
.drawer h3,.modal h3{font:700 20px/1.2 var(--f-display);margin:0}
.drawer h4{margin:6px 0 0;font-size:13px}
.modal{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal.wide{width:min(760px,calc(100% - 32px))}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full,.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;background:var(--bg)}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding-left:10px}
.money span{font:12.5px var(--f-num);color:var(--muted)}
.money input{border:0;background:none;font-family:var(--f-num);text-align:right;width:100%;min-width:0}
.field .money input{background:none}
.money.sm{display:inline-flex;width:150px}
.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint-box{font-size:12.5px;color:var(--muted);background:var(--sunken);border-radius:8px;padding:9px 12px}
.hint-box b{color:var(--ink)}
.check-line{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt-x{display:none;gap:8px;flex-wrap:wrap;margin-top:6px}
.opt:has(input:checked) .opt-x{display:flex}
.opt-x input,.opt-x select{padding:6px 8px;background:var(--surface)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;background:var(--sunken);border-radius:8px;padding:12px 14px}
.kv span{color:var(--muted)} .kv b{font-weight:500;text-align:right}
.formula{font:12.5px/1.7 var(--f-num);background:var(--sunken);border-radius:8px;padding:10px 12px}
.calc{display:flex;flex-direction:column}
.calc .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.calc .row.h{font-weight:600;border-top:0;padding-top:12px}
.calc .row.ind{padding-left:14px;color:var(--muted)}
.calc .row.sub{font-weight:600;border-top:1px solid var(--muted)}
.calc .row.total{border-top:2px solid var(--ink);font-weight:600;font-size:14.5px}
.hist{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.confirm-zone{display:flex;flex-direction:column;gap:8px}
textarea.code{width:100%;font:12px/1.5 var(--f-num);background:var(--sunken)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;z-index:40;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(80px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sheet button{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left}
.sheet svg{width:18px;height:18px;color:var(--accent)}

/* login */
.app-login{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(160deg,var(--accent-soft),var(--bg) 55%)}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.08)}
.login-card h1{font:700 24px var(--f-display);margin:8px 0 0}
.login-card .field input{background:var(--bg)}
.otp{font:500 22px var(--f-num);letter-spacing:.4em;text-align:center}
.proto-note{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin:4px 0 0}

.login{width:100%;display:grid;place-items:center}
.login-card.wide{width:min(480px,100%)}
.form.one{grid-template-columns:minmax(0,1fr)}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint-box.erro{background:var(--crit-soft);color:var(--crit)}
.hint-box.erro b,.hint-box b{color:inherit}
.sync{font-size:11.5px;display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.salvando::before{background:var(--warn)} .sync.erro{color:var(--crit)} .sync.erro::before{background:var(--crit)}
.panel.start{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.steps li.ok span:first-child{color:var(--muted);text-decoration:line-through}
.imp-head{align-items:flex-start}
.imp-head h2{margin-bottom:4px}
.paste-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
.paste-bar .btn{display:inline-flex;gap:8px;align-items:center} .paste-bar .btn svg{width:16px;height:16px}
.paste-bar .sub{flex:1 1 280px}
.ocr-prog{display:grid;gap:6px}
.ocr-prog .bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.ocr-prog .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.imp-img{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vinc{display:grid;gap:8px}
.vinc-t{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.vinc-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.vinc-c{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;color:inherit;font:inherit}
.vinc-c:hover{border-color:var(--accent)} .vinc-c.on{border-color:var(--accent);background:var(--accent-soft)}
.vinc-c svg{width:20px;height:20px;flex:none;color:var(--accent)} .vinc-c b{display:block}
.imp-ed{width:100%;min-width:0;padding:5px 7px;font-size:13px} .imp-ed.wide{min-width:180px} input.imp-ed[type=date]{min-width:128px}
td .imp-ed.r{text-align:right;max-width:120px;margin-left:auto;display:block}
.imp-lado{display:block}
.imp-thumb{display:block;margin:0 18px 12px;max-width:380px;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.imp-thumb img{width:100%;display:block}
table.imp td{vertical-align:top}
.pp .pp-l{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.pp .pp-l b{white-space:nowrap} .pp .pp-l.neg b{color:var(--crit)} .pp .pp-l.pos b{color:var(--good)} .pp .pp-l.tot{border-bottom:0;font-weight:600}
.pp .pp-det{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);margin-top:2px}
.pp .check{margin-top:10px}
.imp-ed.falta{border-color:var(--crit);background:var(--crit-soft)}
.dup-aviso{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.dup-lista{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto}.dup-g{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0}.dup-g legend{font-size:12.5px;padding:0 4px}.dup-i{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}.dup-i:first-of-type{border-top:0}.dup-i input{width:auto;margin:0}.dup-i .sub{display:block}
.pdf-senha{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.pdf-senha input{max-width:220px}
.imp-ed.parc{width:84px;text-align:center}
table.imp select{min-width:150px}
td .imp-ed.r{min-width:100px}
.imp-dest{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.imp-dest label{display:flex;gap:6px;align-items:center}
.imp-dest select{padding:5px 8px}
.pad-x{margin:0 18px 12px}
.pad-b{padding:0 18px 16px}
.tips{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.tips b{color:var(--ink)}
.qr{background:#fff;border-radius:10px;padding:10px;width:max-content;max-width:100%}
.drop.over{background:var(--accent-soft);border-style:solid}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.hero{grid-column:1/-1;grid-row:auto}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:22}
  .brand,.who{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;align-items:center}
  .nav button.sec{display:none}
  .nav .more-btn{display:flex}
  main{padding-bottom:100px}
  .topbar h1{font-size:22px}
  .search{flex-basis:100%;order:3}
  .kpis,.totals,.facts,.facts.f3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.hero .v{font-size:28px}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cardrow{grid-template-columns:minmax(0,1fr) auto}
  .cardrow .barcell{grid-column:1/-1;order:3}
  .sims,.form{grid-template-columns:minmax(0,1fr)}
  .tab{min-width:0;flex:1 1 140px}
  .drop{flex-direction:column;align-items:flex-start}
  .cat{grid-template-columns:minmax(70px,100px) minmax(0,1fr) 92px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:dr .18s ease-out}.modal{animation:md .16s ease-out}@keyframes dr{from{transform:translateX(24px);opacity:.6}}@keyframes md{from{opacity:0;transform:translate(-50%,-48%)}}}
</style>
</head>
<body>
<div id="app"><noscript>Ative o JavaScript para usar o Caixa da Família.</noscript></div>
<div id="layer"></div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/core.js?v=15"></script>
<script src="js/importar.js?v=15"></script>
<script src="js/db.js?v=15"></script>
<script src="js/ui.js?v=15"></script>
<script src="js/chat.js?v=15"></script>
<script src="js/admin.js?v=15"></script>
<script src="js/notif.js?v=15"></script>
<script src="js/dividas.js?v=15"></script>
<script src="js/painel.js?v=15"></script>
<script src="js/sync.js?v=15"></script>
</body>
</html>
